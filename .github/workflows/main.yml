name: Build Zip for Cloudflare Pages

on:
  push:
    branches:
      - main # أو master حسب اسم الفرع لديك

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. فك ضغط أي ملف ZIP مرفوع في المستودع
      - name: Unzip any ZIP files
        run: |
          ZIP_FILES=$(find . -maxdepth 2 -name "*.zip")
          for f in $ZIP_FILES; do
            echo "Unzipping $f..."
            unzip -o "$f" -d .
          done

      # 2. إعداد بيئة Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 3. البحث عن package.json وبناء المشروع
      - name: Install & Build Project
        run: |
          # البحث العميق عن package.json
          PACKAGE_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PACKAGE_PATH" ]; then
            echo "Error: Could not find package.json anywhere in repository!"
            exit 1
          fi
          
          TARGET_DIR=$(dirname "$PACKAGE_PATH")
          echo "Found package.json in: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # تثبيت الحزم والبناء
          bun install
          bun run build
          
          # ضغط محتويات مجلد dist مباشرة من الداخل
          if [ -d "dist" ]; then
            cd dist
            zip -r "$GITHUB_WORKSPACE/cloudflare-dist.zip" .
            echo "Successfully created cloudflare-dist.zip!"
          else
            echo "Error: dist directory was not created after build!"
            exit 1
          fi

      # 4. رفع الملف المضغوط للتحميل
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dist
          path: cloudflare-dist.zip
