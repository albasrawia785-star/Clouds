name: Build Zip for Cloudflare Pages

on:
  push:
    branches:
      - main # أو master حسب اسم الفرع لديك

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        run: bun run build

      # الدخول إلى داخل مجلد dist وضغط محتوياته المباشرة
      - name: Zip Dist Contents
        run: |
          cd dist
          zip -r ../cloudflare-dist.zip .
          cd ..

      # رفع الملف المضغوط جاهزاً ومباشراً
      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dist
          path: cloudflare-dist.zip
